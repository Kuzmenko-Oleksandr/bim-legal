<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Auth Callback</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px}
  .card{max-width:640px;width:100%;background:#1c1c1e;border:1px solid #333;border-radius:16px;padding:28px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#aaa;font-size:14px}
  code{display:block;word-break:break-all;background:#000;padding:16px;border-radius:10px;
       font-size:15px;margin:16px 0;color:#4ade80}
  button{background:#fe2c55;color:#fff;border:0;padding:12px 18px;border-radius:10px;
         font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h1>TikTok authorization</h1>
    <p id="status">Reading code…</p>
    <code id="code">—</code>
    <button onclick="copyCode()">Copy code</button>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code');
  const err = p.get('error');
  const el = document.getElementById('code');
  const st = document.getElementById('status');
  if (code) { el.textContent = code; st.textContent = 'Copy this code and paste it back to your assistant:'; }
  else if (err) { el.textContent = err + ': ' + (p.get('error_description')||''); st.textContent = 'Authorization failed.'; }
  else { st.textContent = 'No code in URL.'; }
  function copyCode(){ if(code){ navigator.clipboard.writeText(code); st.textContent='Copied!'; } }
</script>
</body>
</html>
